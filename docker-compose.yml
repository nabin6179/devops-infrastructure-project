services:
  nginx:
    image: nginx:alpine
    container_name: task2-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: task2-backend
    expose:
      - "5000"
    environment:
      DB_HOST: db
      DB_NAME: task2db
      DB_USER: task2user
      DB_PASSWORD: task2pass
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: task2-db
    environment:
      POSTGRES_DB: task2db
      POSTGRES_USER: task2user
      POSTGRES_PASSWORD: task2pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task2user -d task2db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
